components:
  schemas:
    CloudintegrationtypesAWSAccountConfig:
      properties:
        regions:
          items:
            type: string
          type: array
      required:
      - regions
      type: object
    CloudintegrationtypesAzureMetricsCollectionStrategy:
      type: object
    CloudintegrationtypesAWSIntegrationConfig:
      properties:
        enabledRegions:
          items:
            type: string
          type: array
        telemetryCollectionStrategy:
          $ref: '#/components/schemas/CloudintegrationtypesAWSTelemetryCollectionStrategy'
      required:
      - enabledRegions
      - telemetryCollectionStrategy
      type: object
    CloudintegrationtypesConnectionArtifact:
      properties:
        aws:
          $ref: '#/components/schemas/CloudintegrationtypesAWSConnectionArtifact'
        azure:
          $ref: '#/components/schemas/CloudintegrationtypesAzureConnectionArtifact'
      type: object
    CloudintegrationtypesOldAWSCollectionStrategy:
      properties:
        aws_logs:
          $ref: '#/components/schemas/CloudintegrationtypesOldAWSLogsStrategy'
        aws_metrics:
          $ref: '#/components/schemas/CloudintegrationtypesOldAWSMetricsStrategy'
        provider:
          type: string
        s3_buckets:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
      type: object
    CloudintegrationtypesGettableAgentCheckIn:
      properties:
        account_id:
          type: string
        cloud_account_id:
          type: string
        cloudIntegrationId:
          type: string
        integration_config:
          $ref: '#/components/schemas/CloudintegrationtypesIntegrationConfig'
        integrationConfig:
          $ref: '#/components/schemas/CloudintegrationtypesProviderIntegrationConfig'
        providerAccountId:
          type: string
        removed_at:
          format: date-time
          type:
          - string
          - 'null'
        removedAt:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - account_id
      - cloud_account_id
      - integration_config
      - removed_at
      - cloudIntegrationId
      - providerAccountId
      - integrationConfig
      - removedAt
      type: object
    CloudintegrationtypesAWSPostableAccountConfig:
      properties:
        deploymentRegion:
          type: string
        regions:
          items:
            type: string
          type: array
      required:
      - deploymentRegion
      - regions
      type: object
    CloudintegrationtypesCollectedLogAttribute:
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
      type: object
    CloudintegrationtypesOldAWSLogsStrategy:
      properties:
        cloudwatch_logs_subscriptions:
          items:
            properties:
              filter_pattern:
                type: string
              log_group_name_prefix:
                type: string
            type: object
          type:
          - array
          - 'null'
      type: object
    CloudintegrationtypesCollectedMetric:
      properties:
        description:
          type: string
        name:
          type: string
        type:
          type: string
        unit:
          type: string
      type: object
    CloudintegrationtypesAzureTelemetryCollectionStrategy:
      properties:
        logs:
          $ref: '#/components/schemas/CloudintegrationtypesAzureLogsCollectionStrategy'
        metrics:
          $ref: '#/components/schemas/CloudintegrationtypesAzureMetricsCollectionStrategy'
        resourceProvider:
          type: string
        resourceType:
          type: string
      required:
      - resourceProvider
      - resourceType
      type: object
    CloudintegrationtypesAzureServiceMetricsConfig:
      properties:
        enabled:
          type: boolean
      type: object
    CloudintegrationtypesUpdatableService:
      properties:
        config:
          $ref: '#/components/schemas/CloudintegrationtypesServiceConfig'
      required:
      - config
      type: object
    CloudintegrationtypesCloudIntegrationService:
      properties:
        cloudIntegrationId:
          type: string
        config:
          $ref: '#/components/schemas/CloudintegrationtypesServiceConfig'
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        type:
          $ref: '#/components/schemas/CloudintegrationtypesServiceID'
        updatedAt:
          format: date-time
          type: string
      required:
